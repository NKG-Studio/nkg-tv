plugins { id 'com.android.application' }
android {
    namespace 'studio.nkg.tv'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig { applicationId 'studio.nkg.tv'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0-preview' }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }
tasks.named('preBuild') {
    doFirst {
        ['arm64-v8a','x86_64'].each { abi ->
            if (!file("src/main/jniLibs/${abi}/libnkg_jni.so").exists()) {
                throw new GradleException('Native library missing. Run tools/fetch-ncnn.sh and tools/build-native.sh first; see README.')
            }
        }
    }
}
